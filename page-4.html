<!doctype html>
<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Chorasmian&display=swap"
      rel="stylesheet"
    />

    <style>
      .heart {
        width: 150px;
        height: 150px;
        background: #de90c6;
        position: relative;
        transform: rotate(-45deg);
        box-shadow: rgba(0, 0, 0, 0.2) 0px 4px 12px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center; /* center text vertically and horizontally */
      }
      .heart:hover {
        background: #e4a8d2;
        cursor: pointer;
      }

      .heart:hover::before,
      .heart:hover::after {
        background: #e4a8d2;
        cursor: pointer;
      }

      .heart::before,
      .heart::after {
        content: "";
        width: 150px;
        height: 150px;
        background: #de90c6;
        border-radius: 50%;
        position: absolute;
      }

      .heart::before {
        top: -75px;
        left: 0;
      }

      .heart::after {
        top: 0;
        left: 75px;
      }

      .heart-text {
        transform: rotate(45deg);
        color: white;
        font-size: 30px;
        font-weight: bold;
        text-align: center;
        pointer-events: none;
        z-index: 100;
      }

      .text {
        transform: rotate(45deg);
        color: white;
        font-size: 40px;
        font-weight: bold;
        z-index: 100;
      }

      body {
                background-image: url("images/hi.png");
          background-size:cover;
  background-position: center;
  background-repeat: no-repeat;
        background-color: #faa7e0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: "Roboto", sans-serif;
        overflow: hidden;
        color: white;
      }

      /* container for the whole row */
      .container {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .main-column {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .side-img {
        width: 200px;
        height: 300px;
        object-fit: cover;
        border-radius: 20px;
        border: 5px solid white;
      }

      .side-img.left {
        margin-right: 20px;
      }

      .side-img.right {
        margin-left: 20px;
      }

      .btn {
        border: 2px solid white;
        border-radius: 20px;
        color: rgb(255, 255, 255);
        font-size: 15px;
        font-family: "Roboto", sans-serif;
        padding: 10px;
        width: 5rem;
        background-color: rgba(74, 28, 69, 0.3);
        box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
        transition: transform 0.3s ease;
      }

      .btn:hover {
        transform: scale(1.1);
        cursor: pointer;
      }

      .cell {
        border: 1px solid white;
        border-radius: 20px;
        padding: 15px;
        background-color: rgba(74, 28, 69, 0.3);
        margin: 10px;
        width: 30rem;
        box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
      }

      .cell:hover {
        background-color: rgba(74, 28, 69, 0.5);
        cursor: pointer;
      }

      h1,
      span {
        text-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
      }

            .title, #bladee-message, #success-message {
        color: white;
        text-shadow:
          0 2px 4px rgba(0, 0, 0, 0.4),
          0 4px 8px rgba(0, 0, 0, 0.4),
          0 8px 16px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img src="images/nic.jpg" class="side-img left" alt="Left Image" />

      <audio autoplay loop>
        <source
          src="music/Yung Lean - Hennessy & Sailor Moon (feat (mp3cut.net).mp3"
          type="audio/mpeg"
        />
      </audio>
      <div class="main-column">
        <div class="heart">
          <span class="text">click</span>
          <span class="heart-text" style="display: none">happy vday, my bear <3</span>
        </div>
      </div>


      <img
        src="images/cute-paulo.jpg"
        class="side-img right"
        alt="Right Image"
      />

    </div>

    <script src="page-4.js"></script>
  </body>
</html>
